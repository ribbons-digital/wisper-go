[package]
name = "wispergo-core"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
whisper-rs = { version = "0.16", optional = true }

[features]
## Enables the in-process whisper.cpp ASR provider (Phase 2). Builds whisper.cpp
## via whisper-rs-sys, which requires cmake + clang at build time. Metal is
## enabled on Apple Silicon; the feature is otherwise CPU-only. Off by default
## during the bridge state where the bundled whisper-cli sidecar is still ASR.
whisper-rs = ["dep:whisper-rs"]

# Apple Silicon: enable Metal acceleration.
# Intel Macs and other targets fall back to the CPU build (no metal feature).
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
whisper-rs = { version = "0.16", optional = true, features = ["metal"] }

[dev-dependencies]
httpmock = "0.7"
