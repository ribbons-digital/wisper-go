[package]
name = "wispergo-desktop"
version = "0.1.0"
description = "Local-first desktop dictation"
authors = ["Ribbons Digital"]
edition = "2021"

[lib]
name = "wispergo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
wispergo-core = { path = "../../../crates/wispergo-core" }
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
arboard = "3.6"
block2 = "0.6"
cpal = "0.17"
core-foundation = "0.10"
core-foundation-sys = "0.8"
enigo = "0.6"
macos-accessibility-client = "0.0.2"
objc2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
